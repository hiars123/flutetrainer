<header class="top">
  <h1>Flötenlehrer</h1>
  <nav class="tabs" aria-label="Bereiche">
    @for (t of tabs; track t.id) {
      <button type="button" [attr.aria-current]="tab() === t.id ? 'page' : null" (click)="tab.set(t.id)">
        {{ t.label }}
      </button>
    }
    <button
      type="button"
      class="gear"
      aria-label="Einstellungen"
      [attr.aria-current]="tab() === 'einstellungen' ? 'page' : null"
      (click)="tab.set('einstellungen')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.600c0 .2.200.4.500.4h4c.3 0 .5-.2.5-.4l.4-2.600c.6-.3 1.200-.6 1.700-1l2.500 1c.2.100.5 0 .6-.2l2-3.500a.5.5 0 0 0-.1-.6L19.400 13zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"
        />
      </svg>
    </button>
  </nav>
</header>

<main>
  @switch (tab()) {
    @case ('pfad') {
      <app-path (openSong)="openSong($event)" (openPool)="openPool($event)" />
    }
    @case ('lieder') {
      <app-practice category="lied" />
    }
    @case ('uebungen') {
      <app-practice category="uebung" />
    }
    @case ('quiz') {
      <app-trainer [startPool]="poolRequest()" />
    }
    @case ('tabelle') {
      <app-chart />
    }
    @case ('einstellungen') {
      <app-settings />
    }
  }
</main>
